name: Build & Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Test py${{ matrix.python-version }} [${{ matrix.extras }}]"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["dev"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history + tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and deps (extras = ${{ matrix.extras }})
        run: pip install -e ".[${{ matrix.extras }}]"
        working-directory: SerenLodestar
        env:
          # Tests don't care about the real version; pin one so scm never has
          # to compute from history (and so a tagless branch can't trip it).
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: SerenLodestar

  # ── Install shapes ──────────────────────────────────────────────────────
  #
  # `test` installs [dev] and runs pytest FROM INSIDE the repo. That proves the
  # code works with every dev dependency present and ./seren_lodestar on sys.path.
  # It proves nothing about what an operator gets from `pip install seren-lodestar`.
  #
  # Two real breakages got past `test` and would have been caught here:
  #   1. An unconditional import of an OPTIONAL dependency - invisible when the
  #      dev install pulls it in anyway, fatal on a bare install.
  #   2. A satisfied-but-stale floor (seren-meninges>=2.0.0 happily resolving
  #      2.0.0 after 2.1.0 shipped). Only a real resolve in a clean env shows it.
  #
  # So: install every SHAPE an operator can ask for, then import the app FROM
  # OUTSIDE THE REPO so the source tree cannot mask a missing dependency.
  #
  # Every shape runs on every push, including the slow ones, and this job GATES
  # the release. The maintainer eats the CI time so nobody eats a broken install.
  install-shapes:
    runs-on: ubuntu-latest
    name: "Install ${{ matrix.shape.label }}"
    strategy:
      fail-fast: false
      matrix:
        shape:
          - { label: "bare",          spec: ".",            updates: "unavailable" }
          - { label: "[corp]",    spec: ".[corp]",    updates: "unavailable" }
          - { label: "[updates]", spec: ".[updates]", updates: "wired" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ${{ matrix.shape.spec }}
        run: pip install "${{ matrix.shape.spec }}"
        working-directory: SerenLodestar
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Install a test client (NOT part of the shape under test)
        # starlette's TestClient needs httpx at runtime. It is a test tool, not
        # something seren_lodestar imports, so adding it cannot mask a missing runtime
        # dependency - but leaving it out fails the smoke step for a reason that
        # has nothing to do with the install shape.
        run: pip install "httpx2" || pip install "httpx"

      - name: Import and construct the app OUT OF TREE
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          from seren_lodestar.app import create_app
          from fastapi.testclient import TestClient

          app = create_app()
          print("app constructed OK")

          with TestClient(app) as c:
              r = c.get("/")
          assert r.status_code == 200, f"/ returned {r.status_code}: {r.text[:300]}"
          u = r.json().get("updates")

          assert isinstance(u, dict), f"/ must always carry an updates dict, got {u!r}"
          expected = {"status", "distribution", "installed", "latest",
                      "update_available", "detail", "checked_at"}
          assert set(u) == expected, f"key drift: {set(u) ^ expected}"
          assert isinstance(u["update_available"], bool)

          if "${{ matrix.shape.updates }}" == "unavailable":
              # No [updates] extra -> say so plainly, and NEVER report a clean
              # bill of health it has no way to verify.
              assert u["status"] == "unavailable", f"expected unavailable, got {u['status']}"
              assert u["update_available"] is False
              assert u["detail"], "unavailable must carry a reason"
          else:
              # With the extra, anything but "unavailable" passes - the runner
              # may not reach PyPI, and "error" is correct for a box offline.
              assert u["status"] != "unavailable", (
                  "[updates] installed but the checker did not wire up - usually a "
                  "seren-meninges floor that resolved something too old"
              )
          print(f"updates block OK: status={u['status']}")
          PY

  build-and-release:
    needs: [test, install-shapes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from the tag graph

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build
        working-directory: SerenLodestar

      - name: Upload dist as artifact (handed to the publish job)
        uses: actions/upload-artifact@v7
        with:
          name: seren-lodestar-dist
          path: SerenLodestar/dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SerenLodestar/dist/*

  pypi-publish:
    needs: [build-and-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/seren-lodestar
    permissions:
      id-token: write   # MANDATORY for Trusted Publishing; job-level = least privilege
    steps:
      - name: Download the built dist
        uses: actions/download-artifact@v4
        with:
          name: seren-lodestar-dist
          path: dist/

      - name: Publish to PyPI (tokenless)
        uses: pypa/gh-action-pypi-publish@release/v1