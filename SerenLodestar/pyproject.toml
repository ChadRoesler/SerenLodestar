[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-lodestar"
dynamic = ["version"]
description = "Cluster head / guiding star for the Seren stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Chad Roesler" }]
keywords = ["llm", "cluster", "jetson", "seren"]

dependencies = [
    # ── WHY THE <2 CAP IS NOT OPTIONAL ────────────────────────────────────
    # mcp 2.0.0 REMOVED FastMCP. `mcp.server.fastmcp` does not exist in 2.x at
    # all; the server class is now mcp.server.mcpserver.MCPServer with a
    # different API. Our MCP surface is written against FastMCP. The last 1.x
    # that still carries it is 1.29.0.
    #
    # Uncapped, a fresh install resolves 2.0.0, the import fails, the
    # ImportError gate catches it exactly as designed, and the service comes
    # up in HTTP-only mode with one log line — i.e. /mcp silently ceases to
    # exist. A graceful fallback around a DEPENDENCY BREAK is indistinguishable
    # from the SDK not being installed, which is the worst possible failure
    # mode: it looks like it's working.
    #
    # So: cap it, don't hope. Lift the cap in the same commit that ports the
    # server to the MCPServer API — across the whole family at once, since
    # they're deliberate copies of each other.
    "mcp>=1.3.0,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "starlette>=0.37",
    "croniter>=2.0",
    # Meninges 2.0.0 is the floor: it carries the bearer-auth byte-compare fix
    # (a non-ASCII Authorization header used to 500 instead of 401) and
    # seren_meninges.updates, which the [updates] extra below imports. <3
    # because a MAJOR here is an un-defaultable security change, and that is
    # the only thing that should ever force a bump.
    "seren-meninges>=2.0.0,<3",
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
# "is there a newer seren-lodestar" reporting on GET /. Opt-in, because a
# service that never leaves a LAN has no reason to talk to PyPI. Pulls the
# Meninges extra rather than httpx/packaging directly - the check lives in
# seren_meninges.updates and only one repo should own that dep set.
#
# The floor matches the core dep above: updates.py landed in Meninges 2.0.0.
# Resolve anything older and the lifespan import fails, leaving you with
# status="unavailable" forever and no obvious reason why.
updates = ["seren-meninges[updates]>=2.0.0,<3"]

# Corporate / intercepting-proxy support. Routes Python TLS through the OS
# trust store so a corp root CA (Zscaler/Netskope/etc.) is honored without
# hand-exporting .pem files. Opt-in: `pip install 'seren-lodestar[corp]'` +
# tls.trust_system_store: true (the installer's --corp flag sets both).
#
# THIS EXTRA WAS MISSING while config.py already honored
# SEREN_LODESTAR_TRUST_SYSTEM_STORE and the installer already offered --corp -
# so an operator could turn the knob on, watch pip warn "does not provide the
# extra 'corp'" in passing, and get a TLS failure much later with nothing
# pointing back here. The knob and the package that implements it must ship
# together.
corp = ["truststore>=0.9"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
seren-lodestar = "seren_lodestar.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenLodestar"
Repository = "https://github.com/ChadRoesler/SerenLodestar"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenLodestar/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_lodestar*"]

[tool.setuptools.package-data]
seren_lodestar = [
    "viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js",
    "tooling/*.py",
    "scheduling/*.py",
]

[tool.setuptools_scm]
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_lodestar/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
