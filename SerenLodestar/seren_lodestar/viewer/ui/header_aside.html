<!-- Right-side header widgets, filled by scripts.js:
     the overall cluster-health LED and the last-refresh timestamp. The old
     monolith <header> is gone — the shell owns brand + subtitle now. -->
<span id="led-overall"><span class="led" id="led"></span><span id="led-text">connecting…</span></span>
<span id="last-refresh">—</span>
<!-- Glance-screen only (styles.css .glance-only): the actions card has no
     room on a 280px letterbox, so settings and refresh live up here. -->
<button class="aside-btn glance-only" id="aside-settings" title="settings" aria-label="settings">⚙</button>
<button class="aside-btn glance-only" id="aside-refresh" title="force eager rediscovery" aria-label="refresh">↻</button>
