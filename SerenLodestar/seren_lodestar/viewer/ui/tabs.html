<!-- The cluster head's dashboard: the node grid is the first page, and the
     shell auto-activates it. Upgrades is the second: /api/v1/upgrade had
     routes and Workbench tools for weeks before it had a page.
     Shell contract: class="tab" data-tab="<view id>" for the styling and the
     first-tab activation; the CLICK is ours - the shell does not wire one, so
     a tab without onclick is a tab that does nothing (16 Oct 2026). -->
<button class="tab active" data-tab="cluster" onclick="showTab('cluster')">Cluster</button>
<button class="tab" data-tab="upgrades" onclick="showTab('upgrades'); refreshUpgrades()">Upgrades</button>
<!-- The Rack (22 Oct 2026): the carabiners clipped on each box and their
     settings, for someone who does not edit yaml. -->
<button class="tab" data-tab="rack" onclick="showTab('rack'); refreshRack()">Rack</button>
